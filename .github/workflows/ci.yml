name: CI

# Python lint, security and unit tests. Until this existed the only workflow in
# the repo was helm.yaml, so ruff/bandit/pytest never ran anywhere automatically
# and .pre-commit-config.yaml was only as good as each clone's local hooks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the runtime image (Dockerfile: python:3.10-slim)
          python-version: '3.10'

      - name: Install lint tooling
        run: pip install --disable-pip-version-check ruff==0.13.3 'bandit[toml]==1.8.6' pip-audit

      - name: ruff
        # The ruleset and its documented backlog live in pyproject.toml.
        run: ruff check kato/ tests/ benchmarks/

      - name: bandit
        run: bandit -r kato/ -c pyproject.toml

      - name: pip-audit
        # Fails on any published advisory against the pinned runtime set. When
        # it fires, prefer raising the floor of just the affected package in
        # requirements.txt over a wholesale re-resolution.
        run: pip-audit -r requirements.lock --progress-spinner off

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.15.1
        ports: ['6333:6333']
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports: ['8123:8123', '9000:9000']
        # Without this the image logs "neither CLICKHOUSE_USER nor
        # CLICKHOUSE_PASSWORD is set, disabling network access for user
        # 'default'" and every request from the runner (which reaches the
        # service over the mapped port, i.e. not from inside the container)
        # fails with AUTHENTICATION_FAILED. Test-only credentials-free access;
        # the compose stack and the chart both go through users.xml/secrets.
        env:
          CLICKHOUSE_SKIP_USER_SETUP: '1'
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      # Without this the processor's knowledge base refuses to build a Redis
      # client and every observe returns 500, while /health and session
      # creation still succeed -- so the failure looks like a test bug rather
      # than a missing setting. The compose stack sets it explicitly too.
      REDIS_ENABLED: 'true'
      QDRANT_HOST: localhost
      QDRANT_PORT: '6333'
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: '8123'
      SERVICE_NAME: kato
      # Several tests gate on the worker count: the same-session write
      # serialization guarantee only holds under a single worker, and
      # run_tests.sh normally detects this off the running container, which
      # does not exist on the runner. Pin it so those gates evaluate correctly.
      KATO_WORKERS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        # requirements.lock is runtime only; pytest and its plugins live in
        # tests/requirements.txt so they are not shipped in the image.
        run: |
          pip install --disable-pip-version-check -r requirements.lock
          pip install --disable-pip-version-check -r tests/requirements.txt

      - name: Initialise ClickHouse schema
        # ClickHouse's HTTP interface runs one statement per request, so the
        # schema cannot be POSTed as a single file (error 62, "Multi-statements
        # are not allowed"). The script sends the statements individually,
        # fails explicitly if the server never becomes ready, and prints the
        # server's error body instead of a bare curl exit code.
        run: python scripts/apply_clickhouse_schema.py --wait 60

      - name: Import check
        # Cheap guard against a deleted module still being imported somewhere:
        # a runtime-only ImportError would otherwise surface in production.
        run: python -c "import kato.services.kato_fastapi"

      - name: Start KATO
        # tests/tests/unit/ is not purely in-process: much of it talks to a live
        # service on :8000. With no service running, 291 tests skipped and the 10
        # in test_error_handling.py failed -- that file calls requests directly
        # with none of the services_available guard the fixture-based tests use,
        # so each test exhausted its retry budget against a dead port. That is
        # what made this job take ~59 minutes and report failure on every commit
        # since the workflow was added.
        run: |
          python -m uvicorn kato.services.kato_fastapi:app \
            --host 127.0.0.1 --port 8000 \
            --workers "$KATO_WORKERS" \
            --limit-concurrency 100 \
            --timeout-keep-alive 5 \
            > /tmp/kato-server.log 2>&1 &
          kato_pid=$!
          echo "kato_pid=$kato_pid" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "KATO ready after ${i}s"
              exit 0
            fi
            if ! kill -0 "$kato_pid" 2>/dev/null; then
              echo "::error::KATO exited during startup"
              cat /tmp/kato-server.log
              exit 1
            fi
            sleep 1
          done
          echo "::error::KATO did not become healthy within 90s"
          cat /tmp/kato-server.log
          exit 1

      - name: Unit tests
        run: python -m pytest tests/tests/unit/ -q

      - name: KATO server log
        # The server log is the only place a 500 raised inside a request shows a
        # traceback; the test output sees a status code. Always print it, since a
        # green run that silently logged errors is worth knowing about too.
        if: always()
        run: cat /tmp/kato-server.log || true
