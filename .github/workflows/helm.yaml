name: Helm Chart

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'config/clickhouse/init.sql'
      - '.github/workflows/helm.yaml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'charts/**'
      - 'config/clickhouse/init.sql'
      - '.github/workflows/helm.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  CHART_PATH: charts/kato
  CHART_NAME: kato
  OCI_REGISTRY: ghcr.io/sevakavakians/charts
  KUBECONFORM_VERSION: v0.6.7
  HELM_UNITTEST_VERSION: 0.5.2

jobs:
  lint-render:
    name: Lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: helm lint
        run: helm lint ${{ env.CHART_PATH }}

      - name: Verify init.sql is in sync with chart-vendored copy
        run: |
          set -eu
          diff -u config/clickhouse/init.sql ${{ env.CHART_PATH }}/scripts/init.sql

      - name: helm template (matrix)
        run: |
          set -eu
          mkdir -p /tmp/rendered
          for f in ${{ env.CHART_PATH }}/ci/values-*.yaml; do
            name=$(basename "$f" .yaml)
            echo "::group::render $name"
            helm template kato ${{ env.CHART_PATH }} -f "$f" \
              --namespace kato-test --create-namespace \
              > "/tmp/rendered/${name}.yaml"
            echo "::endgroup::"
          done

      - name: Install kubeconform
        run: |
          set -eu
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      - name: kubeconform validate (rendered)
        run: |
          set -eu
          for f in /tmp/rendered/*.yaml; do
            echo "::group::kubeconform $(basename "$f")"
            kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "$f"
            echo "::endgroup::"
          done

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version ${{ env.HELM_UNITTEST_VERSION }}

      - name: helm-unittest (skip when no tests directory)
        run: |
          if [ -d "${{ env.CHART_PATH }}/tests" ] && ls ${{ env.CHART_PATH }}/tests/*_test.yaml >/dev/null 2>&1; then
            helm unittest ${{ env.CHART_PATH }}
          else
            echo "No helm-unittest tests defined yet — skipping."
          fi

      - name: Upload rendered artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: /tmp/rendered/
          retention-days: 7

  publish:
    name: Publish chart to OCI
    needs: lint-render
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Read chart version
        id: chart
        run: |
          set -eu
          v=$(grep -E '^version:' ${{ env.CHART_PATH }}/Chart.yaml | head -n1 | awk '{print $2}' | tr -d '"')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Chart version: $v"

      - name: helm package
        run: |
          set -eu
          mkdir -p /tmp/pkg
          helm package ${{ env.CHART_PATH }} --destination /tmp/pkg

      - name: helm push (OCI)
        run: |
          set -eu
          helm push "/tmp/pkg/${{ env.CHART_NAME }}-${{ steps.chart.outputs.version }}.tgz" oci://${{ env.OCI_REGISTRY }}

      - name: Attach chart .tgz to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release upload "${GITHUB_REF##*/}" \
            "/tmp/pkg/${{ env.CHART_NAME }}-${{ steps.chart.outputs.version }}.tgz" \
            --clobber || echo "Release does not exist yet — chart published to OCI only."
