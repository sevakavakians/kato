# HPA + PDB + NetworkPolicy together, minimum viable secrets.
replicaCount: 3

clickhouse:
  host: clickhouse
  auth:
    existingSecret: kato-clickhouse

redis:
  urlExistingSecret: kato-redis

qdrant:
  host: qdrant
  auth:
    existingSecret: kato-qdrant

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  ingressFrom:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: gateway
  egressCIDRs:
    - 10.0.0.0/8
