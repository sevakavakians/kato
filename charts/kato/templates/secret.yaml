{{- /*
This Secret is rendered ONLY when secrets.create=true. It's a quickstart
convenience for evaluation/dev. In production, pre-create Secrets via your
own pipeline (External Secrets Operator, Vault CSI, sealed-secrets, SOPS)
and reference them via clickhouse.auth.existingSecret, redis.urlExistingSecret,
qdrant.auth.existingSecret.
*/ -}}
{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kato.credentialsSecretName" . }}
  labels:
    {{- include "kato.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (not .Values.clickhouse.auth.existingSecret) .Values.clickhouse.auth.password }}
  clickhouse-password: {{ .Values.clickhouse.auth.password | quote }}
  {{- end }}
  {{- if and (not .Values.redis.urlExistingSecret) .Values.redis.auth.password }}
  redis-url: {{ printf "%s://:%s@%s:%v/%v"
                  (ternary "rediss" "redis" .Values.redis.tls)
                  .Values.redis.auth.password
                  (required "redis.host is required when secrets.create=true and no urlExistingSecret is provided" .Values.redis.host)
                  .Values.redis.port
                  .Values.redis.database | quote }}
  {{- end }}
  {{- if and (not .Values.qdrant.auth.existingSecret) .Values.qdrant.auth.apiKey }}
  qdrant-api-key: {{ .Values.qdrant.auth.apiKey | quote }}
  {{- end }}
{{- end }}
