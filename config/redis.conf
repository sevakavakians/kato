# Redis configuration for KATO pattern metadata storage
# Base configuration: pure in-memory mode (no persistence)
# Enable persistence with REDIS_PERSISTENCE=true in .env
# See: ./kato-manager.sh enable-persistence (deployment)

# Persistence disabled by default (in-memory mode)
# WARNING: Without persistence, ALL Redis data (pattern frequency, symbol
# stats, global metadata, pre-computed metrics) is lost on container restart.
# This causes zero prediction metrics since ClickHouse patterns survive but
# Redis metadata does not. Set REDIS_PERSISTENCE=true in .env to enable.
# When REDIS_PERSISTENCE=true is set, persistence flags are added
# via docker compose command-line overrides
save ""
appendonly no
dir /data

# Memory management
maxmemory 8gb
# Evict least recently used keys if memory full
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Security
#
# protected-mode MUST stay off while no password is configured. It refuses every
# non-loopback connection when no password is set -- the explicit bind directive
# below does NOT exempt it -- so turning it on breaks KATO -> Redis over
# kato-network with "DENIED Redis is running in protected mode". Verified
# against redis:7-alpine (7.4.8).
#
# It is set explicitly rather than left out: this image's compiled default
# happens to be 'no', but upstream Redis ships 'yes', so relying on the default
# would make the stack's behaviour depend on the base image.
#
# The actual protections are therefore:
#   1. the host-published port is bound to 127.0.0.1 (docker-compose.yml and
#      deployment/docker-compose.yml), so Redis is not reachable from the LAN;
#   2. REDIS_PASSWORD, which docker-compose passes through as --requirepass.
# Setting REDIS_PASSWORD is the right next step -- with a password configured,
# protected-mode can be turned back on.
protected-mode no
# Bind to all interfaces (Docker internal network); the host-published port is
# bound to 127.0.0.1 in docker-compose.yml.
bind 0.0.0.0 ::
