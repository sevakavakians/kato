services:
  # Qdrant vector database
  qdrant:
    # Pinned so it cannot drift again: it was :latest, which moved to 1.17
    # while qdrant-client stayed on 1.15. The client logs a compatibility
    # warning about that minor gap but works correctly against this server
    # (verified); closing the gap needs the query_points() migration first,
    # because 1.17 removed the search() API KATO uses.
    image: qdrant/qdrant:v1.17.1
    container_name: kato-qdrant
    # NOTE: QDRANT__SERVICE__API_KEY is intentionally NOT set here.
    # An empty value causes Qdrant to reject ALL requests (401).
    # To enable Qdrant auth, use docker-compose.auth.yml override.
    ports:
      # Bound to loopback: these backing stores have no authentication by
      # default, so publishing them on every host interface exposes all tenant
      # data to the LAN. Host-side tooling (scripts/rehydrate_redis.py,
      # scripts/check_store_parity.py) still reaches them on localhost; KATO
      # itself uses the kato-network service names and never the published port.
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - kato-network
    restart: unless-stopped

  # Redis for session storage and pattern metadata
  redis:
    image: redis:7-alpine
    container_name: kato-redis
    command: >-
      sh -c 'redis-server /usr/local/etc/redis/redis.conf
      ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}
      ${REDIS_PERSISTENCE:+--save "900 1" --save "300 10" --save "60 10000"
      --dbfilename kato_patterns.rdb --rdbcompression yes --rdbchecksum yes
      --appendonly yes --appendfilename kato_patterns.aof --appendfsync everysec
      --aof-use-rdb-preamble yes --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb}'
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - kato-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a \"$REDIS_PASSWORD\" --no-auth-warning} ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse for pattern data storage
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: kato-clickhouse
    ports:
      - "127.0.0.1:8123:8123"  # HTTP interface
      - "127.0.0.1:9000:9000"  # Native client interface
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./config/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./config/clickhouse/users.xml:/etc/clickhouse-server/users.xml:ro
      - ./config/clickhouse/logging.xml:/etc/clickhouse-server/config.d/logging.xml:ro
    networks:
      - kato-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G  # Increased for large training sessions (pattern data + system logs)
    environment:
      - CLICKHOUSE_DB=kato
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"${CLICKHOUSE_PASSWORD:-}\" --query 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Single KATO Service - Configuration is now per-session
  kato:
    build:
      context: .
      dockerfile: Dockerfile
    image: kato:latest
    container_name: kato
    environment:
      - SERVICE_NAME=kato
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_HTTPS=${QDRANT_HTTPS:-false}
      - REDIS_URL=redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      - REDIS_ENABLED=true
      - REDIS_TLS=${REDIS_TLS:-false}
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=kato
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_SECURE=${CLICKHOUSE_SECURE:-false}
      - LOG_LEVEL=INFO
      - SESSION_TTL=3600
      - SESSION_AUTO_EXTEND=true
      # Multi-worker uvicorn (set via kato-manager.sh --workers N, .env, or shell env).
      - KATO_WORKERS=${KATO_WORKERS:-4}
      - KATO_LIMIT_CONCURRENCY=${KATO_LIMIT_CONCURRENCY:-100}
      # ClickHouse send/receive timeout. Now actually applied (previously the
      # setting existed but nothing read it; the client hardcoded 30s).
      - REQUEST_TIMEOUT=120.0
      # Recall-safe candidate bound: pushes a provable upper bound on the
      # similarity score into ClickHouse so patterns that cannot reach
      # recall_threshold are never loaded. Lossless -- set ENABLED=false to
      # roll back to querying the whole corpus. AUDIT=true additionally runs
      # the unbounded query and verifies nothing reachable was dropped
      # (expensive; for staging and post-rollout windows).
      - KATO_RECALL_BOUND_ENABLED=${KATO_RECALL_BOUND_ENABLED:-true}
      - KATO_RECALL_BOUND_AUDIT=${KATO_RECALL_BOUND_AUDIT:-false}
    ports:
      - "8000:8000"
    networks:
      - kato-network
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  kato-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  qdrant-data:
  redis-data:
  clickhouse-data:
  clickhouse-logs: