[project]
name = "kato"
version = "5.1.1"
description = "Knowledge Abstraction for Traceable Outcomes - Deterministic memory and prediction system"
authors = [{name = "Sevak Avakians", email = "sevakavakians@gmail.com"}]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"

[tool.ruff]
# Same as Black (120 is more readable for modern displays)
line-length = 120
target-version = "py39"

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), and isort (I) by default
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI uses this pattern)
    "B904",   # raise from (we handle this manually)

    # --- LINT BACKLOG -------------------------------------------------------
    # These are NOT approved style. They are pre-existing violations that CI
    # would otherwise fail on, parked here so the gate can be switched on today
    # and the rest of the ruleset (notably F: undefined names, unused imports
    # and unused variables) is enforced from now on. Clear a category, then
    # delete its line. Counts are from the commit that introduced this block.
    "UP006",  # 78  non-pep585-annotation (typing.Dict -> dict, mechanical)
    "UP035",  # 22  deprecated-import (same migration as UP006)
    "N801",   #  3  invalid-class-name       } the camelCase legacy API
    "N802",   # 29  invalid-function-name    } (setSTM/processEvents/...),
    "N803",   #  1  invalid-argument-name    } slated for removal with the
    "N806",   #  6  non-lowercase-variable   } legacy stateful cluster
    "N818",   #  1  error-suffix-on-exception-name
    "SIM102", #  1  collapsible-if
    "SIM105", #  3  suppressible-exception
    "SIM108", #  4  if-else-block-instead-of-if-exp
    "SIM118", #  1  in-dict-keys
    "C414",   #  3  unnecessary-double-cast-or-process
    "C416",   #  1  unnecessary-comprehension
    "E402",   #  1  module-import-not-at-top-of-file
    # ------------------------------------------------------------------------
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py files
"tests/**/test_*.py" = ["F811"]  # Pytest fixtures appear as redefinitions but are intentional

# Test and benchmark backlog. Production code under kato/ is held to the full
# ruleset (minus the backlog above); these are parked separately so clearing
# them does not block enforcement on kato/.
"tests/**" = ["F841", "B007", "B011", "B017", "E741", "SIM222"]
"benchmarks/**" = ["F841", "F401", "B007", "E741"]

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "build",
    "dist"
]
skips = [
    "B101",  # assert_used - we use asserts in tests
    "B601",  # paramiko_calls - not applicable
]

[tool.vulture]
exclude = [
    ".venv/",
    "venv/",
    "tests/",
    "build/",
    "dist/",
]
min_confidence = 80
sort_by_size = true

[tool.pytest.ini_options]
# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Output options
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]

# Async support
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Markers
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: API tests",
    "slow: Slow tests",
    "performance: Performance tests",
]

[tool.coverage.run]
source = ["kato"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
